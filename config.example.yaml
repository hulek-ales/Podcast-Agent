# Zkopíruj na config.yaml a uprav.
#
# Klíč sem psát nemusíš: přidej ho v administraci (uloží se do keys.json vedle
# tohohle souboru, práva 600) nebo do PODCAST_PROXY_KEY. Pořadí, ve kterém se
# hledá: administrace → prostředí → tenhle soubor.

proxy:
  url: http://ollama-proxy:11435
  key: ""                        # raději nech prázdné, viz výše
  timeout_s: 900

models:
  embed: nomic-embed-text        # lokální, na shlukování témat (~300 MB VRAM)
  summarize: gemma4:12b          # lokální, přes frontu úloh (objemová práce)
  script: gpt-5-mini             # komerční přes proxy — tady záleží na češtině
  script_provider: openai        # slug poskytovatele v proxy
  tts: tts-cs                    # model GPU služby (poskytovatel typu gpu)

episode:
  style: anchor                  # anchor | brief | duo
  minutes: 9                     # cílová délka mluveného slova
  stories: 7                     # kolik témat do dílu
  max_age_hours: 24              # starší články se ignorují
  similarity: 0.80               # práh shlukování (víc = přísnější)
  fulltext: true                 # dotáhnout plný text u vybraných témat
  temperature: 0.6
  # předává se GPU službě:
  voice: jirka.wav               # referenční hlas (soubor ve službě)
  language: cs
  response_format: mp3
  speed: 1.0

tts:
  mode: job                      # job = přes frontu úloh (doporučeno) | direct = průchozí dotaz
  priority: 3
  poll_s: 15
  timeout_s: 7200

jobs:                            # shrnutí přes frontu úloh
  priority: 7
  poll_s: 10
  timeout_s: 5400

output:
  dir: /data/public              # sem jdou mp3, scénáře a feed.xml (vystavuje nginx)
  work_dir: /data/work           # mezivýsledky kroků (--resume); ven se nedostanou
  base_url: http://server:8088           # jak je adresář `dir` vidět zvenku
  keep_episodes: 30              # 0 = nemazat

feed:
  title: "Přehled dne"
  description: "Automatický přehled zpráv z českých a světových zdrojů."
  author: "Podcast agent"
  language: cs
  image: ""                      # URL obrázku 1400×1400 (nepovinné)

# Váha zvedá šanci tématu v pořadí. Ověřeno, že všechny odpovídají.
feeds:
  - {url: "https://ct24.ceskatelevize.cz/rss/hlavni-zpravy", name: "ČT24", weight: 1.3}
  - {url: "https://www.irozhlas.cz/rss/irozhlas", name: "iRozhlas", weight: 1.3}
  - {url: "https://www.seznamzpravy.cz/rss", name: "Seznam Zprávy", weight: 1.1}
  - {url: "https://www.novinky.cz/rss", name: "Novinky", weight: 1.0}
  - {url: "https://www.aktualne.cz/rss/", name: "Aktuálně", weight: 1.0}
  - {url: "https://servis.idnes.cz/rss.aspx?c=zpravodaj", name: "iDNES", weight: 1.0}
  - {url: "https://feeds.bbci.co.uk/news/world/rss.xml", name: "BBC World", weight: 1.2}
  - {url: "https://www.theguardian.com/world/rss", name: "The Guardian", weight: 1.1}
  - {url: "https://feeds.arstechnica.com/arstechnica/index", name: "Ars Technica", weight: 0.8}
  - {url: "https://hnrss.org/frontpage", name: "Hacker News", weight: 0.7}
