# Agent nepotřebuje GPU — veškerá práce jde přes ollama-proxy.
#
# Žádná tajemství tady nejsou: heslo do administrace i klíč k proxy se zadávají
# v administraci a leží v /data (state.json, keys.json, práva 600). Při prvním
# startu se vyrobí náhodné heslo a vypíše se do logu:
#
#     docker compose up -d && docker compose logs podcast-agent | grep heslo
#
# Tady zůstává jen to, co musí být známé dřív, než aplikace naběhne, a co je
# vlastností nasazení, ne uživatele.
services:
  podcast-agent:
    build: .
    image: podcast-agent:latest
    container_name: podcast-agent
    restart: unless-stopped
    environment:
      TZ: Europe/Prague
      # kdy co vychází, se nastavuje u pořadu v administraci
      ADMIN_PORT: "8089"
      # --- za reverzní proxou (viz README → Vystavení do internetu) ---
      # Schválně jen v prostředí: kdo může tohle přepnout, obejde zamykání
      # po špatných heslech i omezení sítí, takže to nepatří do webu.
      PODCAST_BEHIND_PROXY: "${PODCAST_BEHIND_PROXY:-}"     # 1 = věřit X-Forwarded-For/-Proto
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-127.0.0.1}"  # adresa té proxy, NE "*"
      PODCAST_ADMIN_ALLOW: "${PODCAST_ADMIN_ALLOW:-}"       # sítě pro administraci; prázdné = odkudkoli
    ports:
      - "${ADMIN_PORT:-8089}:8089"      # administrace + feed
    volumes:
      - podcast_data:/data              # config.yaml, keys.json, state.json, work/, public/
    networks:
      - ollamaNet

networks:
  ollamaNet:
    name: ollamaNet
    external: true

volumes:
  podcast_data:
    name: podcast_data
