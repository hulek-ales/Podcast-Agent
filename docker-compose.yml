# Agent nepotřebuje GPU — veškerá práce jde přes ollama-proxy.
#
# Jeden kontejner, jeden port: administrace i podcastový feed servíruje sama
# aplikace, každé s vlastním ověřením (heslo / token v URL). Statický nginx tu
# schválně není — servíroval by hotové díly komukoli na síti.
services:
  podcast-agent:
    build: .
    image: podcast-agent:latest
    container_name: podcast-agent
    restart: unless-stopped
    environment:
      TZ: Europe/Prague
      RUN_AT: "${RUN_AT:-03:10}"        # prázdné = vyrobit díl hned a skončit
      PODCAST_PROXY_URL: "${PODCAST_PROXY_URL:-http://ollama-proxy:11435}"
      PODCAST_PROXY_KEY: "${PODCAST_PROXY_KEY:-}"   # nebo klíč přidej v administraci
      # bez hesla web vůbec nenaběhne (administrace ani feed)
      PODCAST_ADMIN_PASSWORD: "${PODCAST_ADMIN_PASSWORD:?nastav heslo do administrace}"
      PODCAST_FEED_TOKEN: "${PODCAST_FEED_TOKEN:-}"  # prázdné = vyrobí se samo a ukáže v administraci
      ADMIN_PORT: "8089"
      # --- vystavení do internetu (viz README) ---
      PODCAST_BEHIND_PROXY: "${PODCAST_BEHIND_PROXY:-}"   # 1 = věřit X-Forwarded-For/-Proto od proxy
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-127.0.0.1}"  # adresa té reverzní proxy
      PODCAST_ADMIN_ALLOW: "${PODCAST_ADMIN_ALLOW:-}"    # sítě, odkud smí administrace; prázdné = odkudkoli
    ports:
      - "${ADMIN_PORT:-8089}:8089"      # administrace + feed
    volumes:
      - podcast_data:/data              # config.yaml, keys.json, state.json, work/, public/
    networks:
      - ollamaNet

networks:
  ollamaNet:
    name: ollamaNet
    external: true

volumes:
  podcast_data:
    name: podcast_data
