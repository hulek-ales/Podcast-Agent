# Compose pro TrueNAS SCALE → Apps → Discover Apps → Install via YAML (custom app).
#
# Image staví GitHub Actions a leží v GHCR (soukromý balíček u soukromého repa).
# V TrueNASu stačí JEDNOU přidat přihlášení ke ghcr.io a platí pro všechny appky:
#   Apps → Configuration → Manage Container Images → Docker Registries → Add
#   URI: https://ghcr.io   Username: <GitHub jméno>   Password: <classic PAT: read:packages + repo>
#
# Celý postup: docs/DEPLOY-CI.md
# Pro registry v Gitea místo GHCR stačí přepsat řádek image: na
#   git.aleshulek.cz/podcast_ai_agent/agent-app:latest
#
# Hesla ani klíče tu nejsou schválně — heslo do administrace se vyrobí při
# prvním startu a najdeš ho v logu appky, klíč k proxy zadáš v administraci.
# Nastavení agenta (modely, zdroje, rozvrh, veřejná adresa) se taky celé kliká
# v administraci; žádný config.yaml do svazku kopírovat nemusíš.
#
# Po aktualizaci si ověříš, že se opravdu natáhl nový image, v patičce
# administrace: je tam commit, čas buildu a čas startu.
services:
  podcast-agent:
    image: ghcr.io/hulek-ales/podcast-agent:latest
    pull_policy: always
    container_name: podcast-agent
    restart: unless-stopped
    ports:
      - '8089:8089'
    environment:
      TZ: Europe/Prague
      ADMIN_PORT: '8089'
      # --- za reverzní proxou (vystavení do internetu) ---
      PODCAST_BEHIND_PROXY: ''        # '1' = věřit X-Forwarded-For/-Proto
      TRUSTED_PROXY_IPS: 127.0.0.1    # adresa té reverzní proxy, NE '*'
      PODCAST_ADMIN_ALLOW: ''         # např. 192.168.1.0/24 = administrace jen z domova
      # --- self-update z Gitu (nepovinné, když nechceš přestavovat image) ---
      REPO_URL: ''             # https://github.com/hulek-ales/Podcast-Agent.git (nepovinný self-update)
      REPO_BRANCH: main
      GIT_USER: claude-bot
      GIT_TOKEN: ''            # token jen pro čtení (repository: Přečtené)
    networks:
      - ollamaNet
    volumes:
      - type: volume
        source: podcast-data
        target: /data
      - type: volume
        source: podcast-code
        target: /app/src       # kód z Gitu, když je zapnutý self-update

networks:
  ollamaNet:
    name: ollamaNet
    # síť už existuje (visí na ní Open WebUI i ollama-proxy)
    external: true

volumes:
  podcast-data:
    name: podcast_data
  podcast-code:
    name: podcast_code
