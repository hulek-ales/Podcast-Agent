# Postaví image a pushne ho do GHCR po každém pushi do main.
# Build běží na strojích GitHubu — doma není potřeba žádný runner.
# GITHUB_TOKEN se doplní sám, nic se nenastavuje.
#
# Balíček zdědí soukromí repozitáře. TrueNAS ho stáhne, když má jednou přidané
# přihlášení ke ghcr.io (viz docs/DEPLOY-CI.md).
name: docker
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # bez buildx builderu jede výchozí "docker" driver, který neumí
      # exportovat cache — build pak spadne na "Cache export is not supported"
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR bere jen malá písmena, a repo se jmenuje Podcast-Agent
      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # jen :latest — každý commit jako vlastní tag by u soukromého repa snědl
      # 500 MB kvóty; u veřejného na tom nezáleží
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # zapeče se do image a administrace to ukáže v patičce
          build-args: |
            BUILD_REV=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
